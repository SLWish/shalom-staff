[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions."collect-hourly"]
  schedule = "10,25,40,50,54 * * * *"

[functions."collect-on-roster-change"]
  schedule = "*/5 * * * *"

[functions."monitor-defeats"]
  schedule = "* * * * *"

[[redirects]]
  from = "/defeat-api/defeat-status"
  to = "/.netlify/functions/defeat-api-proxy?endpoint=defeat-status"
  status = 200
  force = true

[[redirects]]
  from = "/defeat-api/defeat-subscribe"
  to = "/.netlify/functions/defeat-api-proxy?endpoint=defeat-subscribe"
  status = 200
  force = true

[[redirects]]
  from = "/defeat-api/defeat-manage"
  to = "/.netlify/functions/defeat-api-proxy?endpoint=defeat-manage"
  status = 200
  force = true

[[redirects]]
  from = "/defeat-api/defeat-admin"
  to = "/.netlify/functions/defeat-api-proxy?endpoint=defeat-admin"
  status = 200
  force = true

[[redirects]]
  from = "/defeat-alert/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/manage"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
