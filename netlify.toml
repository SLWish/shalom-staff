[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions."collect-hourly"]
  schedule = "10,25,40,50,54 * * * *"

[functions."collect-on-roster-change"]
  schedule = "*/5 * * * *"

[functions."monitor-defeats"]
  schedule = "* * * * *"

[[redirects]]
  from = "/defeat-api/*"
  to = "https://shalom-staff.netlify.app/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/defeat-alert/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/manage"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
